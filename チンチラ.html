<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ねことの暮らし｜チンチラ</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="type-detail.css">
<link rel="stylesheet" href="footer.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- BGMプレイヤー -->
<div id="bgm-player" data-bgm="BGM/detail.mp3">

  <!-- ♪ アイコン（開閉のみ） -->
  <button id="bgm-open">
    <i class="fa-solid fa-music"></i>
  </button>

  <!-- 詳細パネル -->
  <div id="bgm-panel">

    <!-- 再生 / 停止 -->
    <button id="bgm-play">
      <i class="fa-solid fa-pause"></i>
      <span>再生中</span>
    </button>

    <!-- 再生時間 -->
    <div class="control-row">
      <i class="fa-solid fa-clock"></i>
      <input type="range" id="seek-bar" value="0">
    </div>

    <!-- 音量 -->
    <div class="control-row">
      <i class="fa-solid fa-volume-high"></i>
      <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.5">
    </div>

  </div>
</div>




<body class="types">
<main class="type-detail-main">

<h2>チンチラ</h2>

<div class="type-top">
<img src="images/15チンチラ.jpg" class="type-image">

<section class="basic-info">
<dl>
<dt>品種</dt><dd>チンチラ</dd>
<dt>性格</dt><dd>穏やか・優雅・甘えん坊</dd>
<dt>鳴く頻度</dt><dd>少なめ</dd>
<dt>平均体重</dt><dd>3〜5kg</dd>
<dt>平均寿命</dt><dd>12〜15年</dd>
<dt>名前の由来</dt><dd>チンチラに似た毛色から</dd>
</dl>
</section>
</div>

<section class="feature">
<h3>チンチラの特徴</h3>

<p>
<span class="highlight">長く美しい被毛</span>が魅力の猫です。
</p>

<p>
動きはゆったりしており、
落ち着いた生活を好みます。
</p>

<p>
人との距離感を大切にしつつ、
信頼すると深い愛情を示します。
</p>

<p>
被毛のお手入れは欠かせませんが、
その分優雅な姿を楽しめます。
</p>
</section>
